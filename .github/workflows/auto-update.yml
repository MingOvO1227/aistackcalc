name: Auto Update Live AI Pricing

on:
  schedule:
    # Runs automatically every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch live OpenRouter model pricing
        run: node scripts/fetch-models.mjs

      - name: Verify Astro static build before publishing
        run: npm run build

      - name: Commit and push updated data if changed
        id: git_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/models.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No pricing changes detected today."
          else
            git add src/data/models.json
            git commit -m "chore(data): auto-sync live AI model pricing"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify IndexNow (Bing / Yandex / DuckDuckGo instant indexing)
        if: steps.git_commit.outputs.changed == 'true'
        run: node scripts/submit-indexnow.mjs
